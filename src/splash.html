<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f11;
    color: #f0f0ef;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
  }
  .logo {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c8f542;
  }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid #2e2e38;
    border-top-color: #c8f542;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 12px; color: #8a8a96; font-family: monospace; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <div class="logo">▶ local downloader</div>
  <h1>Media Downloader</h1>
  <div class="spinner"></div>
  <div class="msg">iniciando servidor...</div>
</body>
</html>
